services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ng
      POSTGRES_PASSWORD: ng
      POSTGRES_DB: newgame
    # Faqat 127.0.0.1 — Docker ufw'ni chetlab o'tadi, "55444:5432" bazani internetga ochib qo'yadi
    ports: ["127.0.0.1:55444:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56390:6379"]
volumes:
  pgdata: {}
